name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        pytest tests/ -v
    
    - name: Download sample data
      run: |
        python -c "import urllib.request; import zipfile, io; url = 'https://urlhaus.abuse.ch/downloads/csv/'; req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Research Project; CI Test)'}); resp = urllib.request.urlopen(req, timeout=30); data = resp.read(); z = zipfile.ZipFile(io.BytesIO(data)); f = z.open('csv.txt'); content = f.read().decode('utf-8', errors='replace'); open('data/urlhaus_full.csv', 'w', encoding='utf-8').write(content); print('Downloaded')"
    
    - name: Run quick test
      run: |
        python test_quick.py
    
    - name: Run latency benchmark
      run: |
        python test_latency.py
    
    - name: Run final benchmark
      run: |
        python test_final.py
