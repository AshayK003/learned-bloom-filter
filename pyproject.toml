[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-bloom-filter"
version = "1.0.0"
description = "Streaming Learned Bloom Filters for dynamic URL blocklists"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ashay Kushwaha", email = "ashay.kushwaha@cypherlabs.dev"},
]
keywords = ["bloom-filter", "learned-bloom-filter", "streaming", "membership-query"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pybloom-live>=4.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/AshayK003/learned-bloom-filter"
Repository = "https://github.com/AshayK003/learned-bloom-filter"
Issues = "https://github.com/AshayK003/learned-bloom-filter/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
